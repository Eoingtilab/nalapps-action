name: HopeBridge Maintenance Internal Test AAB Build

on:
  push:
    branches:
      - tmp/hopebridge-maintenance-aab-20260903

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd .tmp-hopebridge
          gradle --no-daemon bundleRelease

      - name: Verify release AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB="$GITHUB_WORKSPACE/.tmp-hopebridge/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          if unzip -l "$AAB" | grep -E '(^|/)lib/.*\.so$'; then
            echo "Unexpected native .so library found." >&2
            exit 1
          fi
          cp "$AAB" "$GITHUB_WORKSPACE/HopeBridge-maintenance-internal-unsigned.aab"
          sha256sum "$GITHUB_WORKSPACE/HopeBridge-maintenance-internal-unsigned.aab" > "$GITHUB_WORKSPACE/HopeBridge-maintenance-internal-unsigned.aab.sha256.txt"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: HopeBridge-maintenance-internal-aab
          path: |
            HopeBridge-maintenance-internal-unsigned.aab
            HopeBridge-maintenance-internal-unsigned.aab.sha256.txt
          if-no-files-found: error
          retention-days: 1
